version: "2"

# Must be <= the Go version the golangci-lint binary was built with,
# or it bails out during type-checking. The pinned linter (v2.12.2,
# see Makefile / CI) ships a pre-built binary compiled with Go 1.26,
# so 1.26 is a valid target. Keep this in sync with go.mod.
run:
  go: "1.26"

linters:
  enable:
    - containedctx
    # contextcheck (doctor plan step 5): context misuse is covered by
    # golangci's linters rather than a bespoke gorefactor rule; the doctor
    # golangci substrate maps these to the conc category.
    - contextcheck
    # Size, shape, and duplication are owned by the linters below rather than
    # by gorefactor's own sensors: the equivalents exist off the shelf, and
    # gorefactor's copies are disabled in .gorefactor.yaml (lint.disable) so
    # doctor --report cannot double-count one defect. gorefactor keeps the
    # rules with an autofix (file-size, error-not-wrapped, funcorder-*,
    # dead-code) and the ones with no Go equivalent at all.
    - errcheck
    - gosec
    - govet
    - staticcheck
    # unused stays as a type-aware second opinion; gorefactor dead-code is
    # name-based and autofixable — doctor maps unused to dead category.
    - unused
    - gocritic
    # Replacements for gorefactor's disabled structural rules, at the same
    # thresholds: long-function -> funlen, complexity -> gocyclo/gocognit,
    # deep-nesting -> nestif, hard-to-maintain -> maintidx,
    # duplicate-block -> dupl, fat-interface -> interfacebloat,
    # excessive-params/returns and fatal-in-library -> revive.
    - funlen
    - gocyclo
    - gocognit
    - nestif
    - maintidx
    - dupl
    - interfacebloat
    - revive
    # Complementary, not replacements: errorlint covers the %v-instead-of-%w
    # half of error wrapping that gorefactor's error-not-wrapped does not,
    # modernize replaces string-concat-in-loop (with its own fix), and iface
    # is the nearest thing to premature-abstraction.
    - errorlint
    - modernize
    - iface

  settings:
    funlen:
      lines: 75
      statements: 0
      ignore-comments: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    maintidx:
      under: 20
    dupl:
      threshold: 150
    interfacebloat:
      max: 8
    iface:
      enable: [identical, unused, opaque]
    revive:
      rules:
        - name: deep-exit
        - name: argument-limit
          arguments: [6]
        - name: function-result-limit
          arguments: [3]
        - name: max-control-nesting
          arguments: [5]
    gosec:
      excludes:
        - G304  # file path from variable — intentional in a file-editing tool
        - G306  # WriteFile 0644 — correct for source files (not secrets)
        - G301  # MkdirAll 0755 — correct for project directories
        - G401  # MD5 — used for code deduplication fingerprinting, not cryptography
        - G501  # MD5 import — same rationale as G401
        - G204  # subprocess with variable — intentional (goimports calls)

  exclusions:
    rules:
      - linters: [funlen, dupl, cyclop, gocyclo, gocognit, nestif, maintidx, errcheck, gosec]
        path: _test\.go
      # CLI command files have inherent branching for flag parsing /
      # subcommand dispatch and aren't core logic; exempt them from
      # complexity, length, and unchecked-error noise.
      - linters: [cyclop, funlen, gocyclo, gocognit, nestif, maintidx, errcheck, gocritic, gosec]
        path: cmd/gorefactor/cmd_.*\.go$
      # The second-tier agent driver (gorefactor-agent) is the same
      # category: a harness of dispatch loops, flag parsing, provider
      # plumbing and stdout reporting, not core algorithmic logic. Same
      # rationale and exemption as the CLI command files above.
      - linters: [cyclop, funlen, gocyclo, gocognit, nestif, maintidx, errcheck, gocritic, gosec]
        path: cmd/gorefactor-agent/.*\.go$
      # Stylistic gocritic rules — preference, not correctness. Pre-existing
      # patterns; lint warnings here aren't worth churning the code.
      - linters: [gocritic]
        text: "ifElseChain|singleCaseSwitch|assignOp|appendAssign"
      # countComplexity is an intentional recursive AST walker — its
      # complexity is structural, not accidental.
      - linters: [cyclop, errcheck]
        path: analyzer/file_size_analyzer\.go$
      - linters: [funlen]
        path: cmd/gorefactor/main\.go$
      # Empty if-err branches in older tests are intentional ("operation
      # may fail; we only care that it ran"). Documented at the call site.
      - linters: [staticcheck]
        path: orchestrator/(integration|integration_conditional|orchestrator_extract)_test\.go$
        text: "SA9003"
      # parser.ParseDir is "deprecated" since Go 1.25 but still works
      # and is correct for our package-rename use case. Migrating to
      # go/packages is tracked separately.
      - linters: [staticcheck]
        text: "SA1019.*parser.ParseDir"
      # Path-traversal taint warnings for a refactoring CLI that operates
      # on user-specified files are not a real threat model.
      - linters: [gosec]
        text: "G703|G122"
      # AST walkers and delete/rename orchestration — complexity is structural.
      - linters: [cyclop]
        path: analyzer/(pattern_detector|dead_code_detector)\.go$
      - linters: [cyclop]
        path: orchestrator/op_delete_rename\.go$
      # log_propagation's statement-sequence walkers (walkOneStmtLogReturn,
      # collectErrorsNewSentinels) branch per AST shape — structural complexity.
      - linters: [cyclop]
        path: analyzer/log_propagation
      # diff.go and mutation.go are harness/dispatch files; complexity is structural.
      - linters: [cyclop, funlen, gocyclo, gocognit, nestif, maintidx]
        path: cmd/gorefactor/(diff|mutation)\.go$
      # AST walkers and orchestration dispatch — structural complexity.
      - linters: [cyclop, funlen, gocyclo, gocognit, nestif, maintidx]
        path: orchestrator/(conditions|cross_package_rewrite_find|cross_package_rewrite_non|dry_run_execute)\.go$
    paths:
      - ^examples/
      - ^benchmark/

# A ratchet, the same shape as gorefactor's own lint baseline
# (.gorefactor-lint-baseline.json): the linters newly enabled above report a few
# hundred findings across a tree written before they ran, and fixing all of them
# is a separate piece of work from adopting them. Only findings in code changed
# since the merge base with origin/main fail. Audit the whole tree at any time
# with `golangci-lint run --new-from-merge-base=""`. Note that
# `golangci-lint run --fix` does not clear these: the modernize rewrites are
# applied by the upstream tool, `go run
# golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix
# ./...`, which fixes 425 of the 427 it finds here.
issues:
  new-from-merge-base: origin/main
