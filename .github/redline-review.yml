# The gate profile redline-pr-watch posts this repository's reviews with. The markers
# are what the Sandbox Studio ticket loop reads to know a pull request's head was reviewed
# (.sandbox/redline-fresh.sh). Every field: redline-review.yml.example.
review_marker: redline-review:v1
finding_marker: redline-finding:v1
blocking: [error, warning]
require_head: true
fail_closed_pane: false
# Lean walkthrough: verdict, short overview and per-file table only (no stated intent,
# PR description, evidence, confirmations or unknowns). body_include: [] keeps it that way.
body_style: walkthrough

# Optional extras in the walkthrough. intent and evidence are left out: the pull
# request already shows its description. coverage, lint, confirmations and unknowns
# are left out too.
body_include:
  - line-counts       # +/- beside each file and on each group heading
  - test-totals       # test files as a heading with totals, no rows
  - generated-totals  # one heading with the generated files' totals
  - low-confidence    # unsure and hedged findings, folded instead of withheld
  - diff-links        # each file links to its diff, except tests
