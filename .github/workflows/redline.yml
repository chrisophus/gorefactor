# Redline reviews this repository's pull requests, through the reusable review.yml. Copy this file
# into another repository as it is: it calls review.yml from chrisophus/redline.
#
# It runs on every push to a pull request from this repository (not a fork's: those get no
# secrets), and again on a "/redline review" comment from someone with write access.
name: redline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: redline-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  redline:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/redline review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: chrisophus/redline/.github/workflows/review.yml@main
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
